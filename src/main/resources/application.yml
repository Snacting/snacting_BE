spring:
  application:
    name: "BGBG"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      defer-datasource-initialization: true

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: none

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: /health-check

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000